gantním minimalistickým designem a prémiovým vzhledem. Kabina je teď díky akustickému sklu ještě tišší a nabízí nové funkce, například ambientní osvětlení či odvětrávaná sedadla."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B01_All-New-Interior.jpeg","type":"image","ratio":"slice"}]}},{"code":"DUAL_DISPLAY_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Dva displeje","extra_copy_formatted":{"title":"Dva displeje","eyebrow":" ","description":"Navigaci, streamování a přehrávání můžete ovládat z 15,4″ středové dotykové obrazovky s vysokým rozlišením, která má teď ještě vyšší jas. Cestující na zadních sedadlech mohou nyní ovládat klimatizaci a multimediální funkce prostřednictvím nově dostupného 8″ sekundárního displeje."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B02_Dual-Displays.jpeg","type":"image","ratio":"slice"}]}},{"code":"SOUND_QUALITY_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Zvuk ve studiové kvalitě","extra_copy_formatted":{"title":"Zvuk ve studiové kvalitě","eyebrow":" ","description":"Užijte si zvuk ve studiové kvalitě na všech sedadlech díky našemu novému prémiovému audiosystému, který si Tesla sama navrhla. Ve vozidlech s pohonem všech kol a vozidel Performance je audiosystém vybaven 17 reproduktory, včetně dvou subwooferů a dvou zesilovačů a ve vozidlech s pohonem zadních kol 9 reproduktory s jedním zesilovačem. Nativně podporuje Spotify, Apple Music a Tidal."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B03_Studio-Quality-Sound.jpeg","type":"image","ratio":"slice"}]}},{"code":"WIRELESS_CHARGER_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Bezdrátové nabíjení telefonu","extra_copy_formatted":{"title":"Bezdrátové nabíjení telefonu","eyebrow":" ","description":"Prostřednictvím přepracované středové konzoly můžete bezdrátově nabíjet dva telefony a mít je přitom stále po ruce – nejsou potřeba žádné kabely. Pomocí jednoho předního a dvou zadních nabíjecích portů USB-C, každý s příkonem až 65 W, můžete rychle nabíjet notebooky a další zařízení. Všechna zařízení snadno propojíte přes Bluetooth a synchronizujete vše od kontaktů až po hudbu."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B05_Wireless-Phone-Charging.jpeg","type":"image","ratio":"slice"}]}},{"code":"GLASS_ROOF_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Prosklená střecha","extra_copy_formatted":{"title":"Prosklená střecha","eyebrow":" ","description":"Velká prosklená střecha vám nabídne více světla, pocit většího prostoru a úchvatný výhled na oblohu. Infračervené i ultrafialové paprsky jsou před proniknutím do kabiny účinně blokovány, což snižuje žár i oslnění i v době, kdy je slunce přímo v nadhlavníku."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B06_Glass-Roof.jpeg","type":"image","ratio":"slice"}]}},{"code":"STAY_CONNECTED_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Zůstaňte připojeni","extra_copy_formatted":{"title":"Zůstaňte připojeni","eyebrow":" ","description":"Dostupné ultraširokopásmové připojení zlepšuje výkon klíče v telefonu, vylepšené mikrofony zajišťují naprosto čistou kvalitu hovorů a díky vylepšenému mobilnímu připojení a dvoupásmovému připojení Wi-Fi máte okamžitý přístup k okolnímu světu, ať jste kdekoli."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B04_Stay-Connected.jpeg","type":"image","ratio":"slice"}]}},{"code":"IMPROVE_YOUR_DRIVE_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Vylepšete si jízdu","extra_copy_formatted":{"title":"Vylepšete si jízdu","eyebrow":" ","description":"Vylepšete si jízdu","superchargers":"{COUNT}+ nabíječek Supercharger po celém světě","destination_chargers":"{COUNT} cílových nabíječek","mobile_service":"Mobilní služby","dog_mode":"Psí Režim" ":"MODEL3_/A03_Charging-That-Works-Everywhere_EU.jpeg","type":"image","ratio":"slice"}]}},"ADAPTABILITY_CARD":{"code":"ADAPTABILITY_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Váš vůz Tesla se vám přizpůsobí","extra_copy_formatted":{"title":"Váš vůz Tesla se vám přizpůsobí","eyebrow":" ","description":"Při příchodu k vozu Tesla vůz automaticky odemkne dveře řidiče, provede preferovaná nastavení a synchronizuje vám hudbu. Stačí nastoupit a odjet."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/A04_Your-Tesla-Adapts-to-You.jpeg","type":"image","ratio":"slice"}]}},"TOUCHSCREEN_CARD":{"code":"TOUCHSCREEN_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Přehlednější ovládání","extra_copy_formatted":{"title":"Přehlednější ovládání","eyebrow":" ","description":"Ke všemu máte přístup z jasně čitelné a mimořádně citlivé středové dotykové obrazovky s 15,4″ úhlopříčkou. Můžete pomocí ní ovládat jízdní funkce a nastavení kabiny. Pokud chcete používat hands-free, můžete vše provádět pomocí hlasových příkazů."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/A05_No-More-Clutter.jpeg","type":"image","ratio":"slice"}]}},"SAFETY_CARD":{"code":"SAFETY_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Navrženo pro bezpečnost","extra_copy_formatted":{"title":"Navrženo pro bezpečnost","eyebrow":" ","description":"Naše vozy jsou navrženy tak, aby splňovaly globální požadavek na 5 hvězdiček v hodnocení bezpečnosti a byly nejbezpečnější na trhu. Funkce aktivní bezpečnosti, jako je automatické nouzové brzdění, jsou součástí standardní výbavy a nic za ně nedoplácíte. Tyto funkce mohou pomoci zmírnit intenzitu nárazu nebo zcela předejít nehodě."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/A06_Built-For-Safety.jpeg","type":"image","ratio":"slice"}]}},"PREMIUM_INTERIOR_CARD":{"code":"PREMIUM_INTERIOR_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Zbrusu nový interiér","extra_copy_formatted":{"title":"Zbrusu nový interiér","eyebrow":" ","description":"Vozy jsou vybaveny zcela novým interiérem s elegantním minimalistickým designem a prémiovým vzhledem. Kabina je teď díky akustickému sklu ještě tišší a nabízí nové funkce, například ambientní osvětlení či odvětrávaná sedadla."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B01_All-New-Interior.jpeg","type":"image","ratio":"slice"}]}},"DUAL_DISPLAY_CARD":{"code":"DUAL_DISPLAY_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Dva displeje","extra_copy_formatted":{"title":"Dva displeje","eyebrow":" ","description":"Navigaci, streamování a přehrávání můžete ovládat z 15,4″ středové dotykové obrazovky s vysokým rozlišením, která má teď ještě vyšší jas. Cestující na zadních sedadlech mohou nyní ovládat klimatizaci a multimediální funkce prostřednictvím nově dostupného 8″ sekundárního displeje."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B02_Dual-Displays.jpeg","type":"image","ratio":"slice"}]}},"SOUND_QUALITY_CARD":{"code":"SOUND_QUALITY_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Zvuk ve studiové kvalitě","extra_copy_formatted":{"title":"Zvuk ve studiové kvalitě","eyebrow":" ","description":"Užijte si zvuk ve studiové kvalitě na všech sedadlech díky našemu novému prémiovému audiosystému, který si Tesla sama navrhla. Ve vozidlech s pohonem všech kol a vozidel Performance je audiosystém vybaven 17 reproduktory, včetně dvou subwooferů a dvou zesilovačů a ve vozidlech s pohonem zadních kol 9 reproduktory s jedním zesilovačem. Nativně podporuje Spotify, Apple Music a Tidal."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B03_Studio-Quality-Sound.jpeg","type":"image","ratio":"slice"}]}},"WIRELESS_CHARGER_CARD":{"code":"WIRELESS_CHARGER_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Bezdrátové nabíjení telefonu","extra_copy_formatted":{"title":"Bezdrátové nabíjení telefonu","eyebrow":" ","description":"Prostřednictvím přepracované středové konzoly můžete bezdrátově nabíjet dva telefony a mít je přitom stále po ruce – nejsou potřeba žádné kabely. Pomocí jednoho předního a dvou zadních nabíjecích portů USB-C, každý s příkonem až 65 W, můžete rychle nabíjet notebooky a další zařízení. Všechna zařízení snadno propojíte přes Bluetooth a synchronizujete vše od kontaktů až po hudbu."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B05_Wireless-Phone-Charging.jpeg","type":"image","ratio":"slice"}]}},"GLASS_ROOF_CARD":{"code":"GLASS_ROOF_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Prosklená střecha","extra_copy_formatted":{"title":"Prosklená střecha","eyebrow":" ","description":"Velká prosklená střecha vám nabídne více světla, pocit většího prostoru a úchvatný výhled na oblohu. Infračervené i ultrafialové paprsky jsou před proniknutím do kabiny účinně blokovány, což snižuje žár i oslnění i v době, kdy je slunce přímo v nadhlavníku."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B06_Glass-Roof.jpeg","type":"image","ratio":"slice"}]}},"STAY_CONNECTED_CARD":{"code":"STAY_CONNECTED_CARD","groups":[],"context":"configurator","options":[],"required":false,"exclusive":false,"name":"Zůstaňte připojeni","extra_copy_formatted":{"title":"Zůstaňte připojeni","eyebrow":" ","description":"Dostupné ultraširokopásmové připojení zlepšuje výkon klíče v telefonu, vylepšené mikrofony zajišťují naprosto čistou kvalitu hovorů a díky vylepšenému mobilnímu připojení a dvoupásmovému připojení Wi-Fi máte okamžitý přístup k okolnímu světu, ať jste kdekoli."},"extra_content_formatted":{"asset":[{"url":"MODEL3_/B04_Stay-Connected.jpeg","type":"image","ratio":"slice"}]}},"IMPROVE_YOUR_DRIVE_CARD":{"code":"IMPROVE_YOUR_DRIVE_CARD","groups":[],"context":"config
