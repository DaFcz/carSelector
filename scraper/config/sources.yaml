# OEM source registry. Anyone on the team can add their brand as a new
# entry without touching the rest of the code — the parser hooks in via
# `parser_key`.
#
# active: false = the brand is in the registry, but the monitor/downloader
# doesn't process it yet (waiting on a parser or on verifying the source page).

sources:
  # Škoda has both combustion models and EVs on the same page, but the
  # price list structure is completely different for them (engine/fuel/
  # transmission/drivetrain vs. battery/power/range), so they're two
  # sources with the same source_url but a different parser_key and model
  # list — this lets the EV parser be worked on without touching the ICE
  # parser (and vice versa), and makes it easy to filter by powertrain in
  # the DB/API.
  - brand: skoda
    country: cz
    # Verified 2026-07-10. The page is server-rendered, but the PDF links
    # do NOT have a .pdf extension — they look like
    # https://www.skoda-auto.cz/_doc/<uuid> (confirmed via
    # Content-Type: application/pdf); the model + document type can only
    # be told from the link text, e.g. "Octavia - Ceník".
    source_url: "https://www.skoda-auto.cz/nabidka/ceniky-katalogy"
    # Not a static filename, but a regex to find the link to the specific
    # PDF price list in the page HTML (anchor text ends with "- Ceník").
    pdf_pattern: 'href="(https://www\.skoda-auto\.cz/_doc/[a-f0-9-]+)">[^<]*-\s*Ceník</a>'
    parser_key: skoda_ice
    active: true
    models: [Fabia, Scala, Kamiq, Octavia, Karoq, Kodiaq, Superb]

  # Verified 2026-07-19 on real price lists for all four models. Enyaq
  # has two tables on one page (SUV and Coupé body styles) — SkodaEvParser
  # therefore looks for the header on every line as it goes, not just once
  # at the start of the page like ICE (where a second table is always on
  # a different page).
  - brand: skoda
    country: cz
    source_url: "https://www.skoda-auto.cz/nabidka/ceniky-katalogy"
    pdf_pattern: 'href="(https://www\.skoda-auto\.cz/_doc/[a-f0-9-]+)">[^<]*-\s*Ceník</a>'
    parser_key: skoda_ev
    active: true
    models: [Enyaq, Elroq, Epiq, Peaq]

  # Verified 2026-07-19. Unlike Škoda, VW doesn't have a single listing
  # page with all models — each model has its own price list page at
  # https://www.volkswagen.cz/<slug>/<slug>/ceniky (VolkswagenDiscoverer
  # builds that URL itself for each model in `models`; source_url here is
  # just an informational link to the model overview). pdf_pattern isn't
  # used for VW (the link is found via the data-gtm-element attribute,
  # not a regex).
  #
  # All 11 currently offered combustion/hybrid models (verified against
  # real PDFs, see commit "Rozšířit VW na všechny spalovací modely").
  # Touareg currently has no regular price list (only "Ceník akčního
  # modelu Touareg Final Edition" — the model is being phased out), so
  # VolkswagenDiscoverer won't find it for now; that's not a bug, just
  # the current state of the lineup.
  - brand: volkswagen
    country: cz
    source_url: "https://www.volkswagen.cz/modely"
    pdf_pattern: null
    parser_key: volkswagen
    active: true
    models: [Golf, Golf Variant, Passat, Polo, T-Cross, T-Roc, Taigo, Tayron, Tiguan, Touareg, Touran]

  # EVs (ID.) have a different engine-description format than ICE (and
  # it's inconsistent even among themselves — "140 kW, 58 kWh" for
  # ID.4/ID.7 vs. "50 kWh 125 kW" for ID.3 Neo/ID. Polo, see
  # VolkswagenEvParser). The "ID.3" model currently has no page of its
  # own (only "ID.3 Neo" — a refresh), so it's listed directly under that
  # name; see discovery/volkswagen.py _SLUG_OVERRIDES for each model's
  # slug (can't be derived from the name because of the period in "ID.").
  # Verified 2026-07-19 on real price lists for all five.
  - brand: volkswagen
    country: cz
    source_url: "https://www.volkswagen.cz/modely"
    pdf_pattern: null
    parser_key: volkswagen_ev
    active: true
    models: [ID.3 Neo, ID.4, ID.7, ID.7 Tourer, ID. Polo]

  # Verified 2026-08-13 on real price lists for all three models. Unlike
  # Škoda/VW, Sportage's ICE and HEV/PHEV variants are two entirely
  # separate PDF documents (not two tables on one page, not mixed rows in
  # one document) — KiaDiscoverer returns both under distinct keys
  # ("Sportage" / "Sportage HEV"), see monitors/discovery/kia.py. One
  # parser handles both since the row format is identical; powertrain
  # (ICE/MHEV/HEV/PHEV) is classified per row from the engine text, same
  # principle as Volkswagen. "Ceed" alone currently has no CZ price list
  # — only "Ceed SW" (estate) does, hence the model name here.
  - brand: kia
    country: cz
    source_url: "https://www.kia.com/cz/prodej/ceniky-katalogy/"
    pdf_pattern: null
    parser_key: kia
    active: true
    models: [Ceed SW, Sportage, Niro]

  # Verified 2026-08-13 on real price lists for all 7 documents (5 models,
  # Corolla split into 3 body styles). source_url is the REAL JSON API the
  # toyota.cz listing page itself calls client-side (found in the page's
  # inline script) — the page's own HTML has no PDF links or model data,
  # it's rendered entirely from this endpoint, so ToyotaDiscoverer fetches
  # it directly rather than scraping HTML. Toyota's catalog has two
  # recurring quirks handled generically (not hardcoded per-model) in
  # ToyotaDiscoverer: (1) each model has many documents (current + prior
  # year, "akce"/"limited_edition" promotional variants, catalogs,
  # accessories, ...) — the current plain price list is picked by
  # excluding promotional markers and taking the highest document id;
  # (2) a redesigned model can appear as two separate catalog entries, a
  # stale one under the plain name and the real current one under a
  # "Nová"/"Nový"/"Nové"-prefixed name (e.g. "RAV4" vs "Nová RAV4") — the
  # prefixed one wins on collision. Corolla Cross is deliberately not
  # included under "Corolla" — Toyota sells it as its own nameplate, not
  # a Corolla body style, see monitors/discovery/toyota.py.
  - brand: toyota
    country: cz
    source_url: "https://pdf.sites.toyota.cz/api/models-documents?_format=json&filter[active]=true&sortBy[itemOrder]=asc"
    pdf_pattern: null
    parser_key: toyota
    active: true
    models: [Yaris, Yaris Cross, Corolla, C-HR, RAV4]

  # Verified 2026-08-28. HyundaiDiscoverer fetches one page per model,
  # like Volkswagen (source_url below is just the overview page it's
  # linked from). The original placeholder model list here was
  # [i10, i20, i30, Kona, Tucson]; i10 now redirects to the i20 page
  # (discontinued in CZ) and was dropped, Bayon has a model page but no
  # discoverable price-list link at all (like VW's Touareg — simply
  # omitted, not an error), and Santa Fe was added since it's a current,
  # actively-sold model with its own price list. Tucson's HEV/PHEV lineup
  # is a separate PDF from its ICE/MHEV one — HyundaiDiscoverer returns
  # that under the "Tucson Hybrid" key (see monitors/discovery/hyundai.py),
  # which doesn't need a separate models entry here (same principle as
  # Kia's "Sportage HEV", see the kia entry above).
  - brand: hyundai
    country: cz
    source_url: "https://www.hyundai.com/cz/modely.html"
    pdf_pattern: null
    parser_key: hyundai
    active: true
    models: [i20, i30, Kona, Tucson, Santa Fe]

  # --- Remaining top-10 OEMs by CZ market share -------------------------
  # Placeholder entries (no discoverer/parser yet, same as before) for the
  # rest of the 10 best-selling brands in the Czech Republic, per 2025
  # new-passenger-car registration data (SDA figures via Cebia.cz/Auto.cz,
  # checked 2026-08-13): Škoda 33.73%, Hyundai 8.31% (now active, see
  # above), Toyota 7.49% (now active, see above), Volkswagen 6.67%, Dacia
  # 4.70%, Kia 4.37% (now active, see above), Mercedes-Benz 3.36% (now
  # active, see above), Ford 3.15%, Renault 2.97%, BMW 2.32%. `models`
  # lists each brand's current core CZ lineup (~proportional to sales
  # share) so the registry already
  # reflects the target model set once a discoverer/parser is written for
  # that brand — activating one is then just flipping `active: true` and
  # filling in `pdf_pattern` (regex or null, depending on whether the
  # discoverer needs one, same as Škoda vs. VW above).
  #
  # source_url below is informational only until each brand's discoverer
  # is written (no discover() implementation reads it yet). Checked
  # 2026-08-13: Dacia/Kia/Renault confirmed reachable (HTTP 200) with a
  # single page listing PDF price lists for multiple/all models directly,
  # same pattern as Škoda. Ford and BMW pages were found by search with
  # titles matching "price lists/catalogs for download" but could not be
  # fetched from this environment (TLS/network timeout on ford.cz and
  # bmw.cz specifically) — URL not independently verified, re-check before
  # building a discoverer against it.

  # Verified 2026-09-07 - the page is a single listing (like Škoda/BMW),
  # server-rendered, one "Ceník" link per model, no pdf_pattern needed
  # (DaciaDiscoverer reads the model straight off each link's own URL
  # slug instead - see that module's docstring). The full current CZ
  # lineup is 6 models, not the 3 originally placeholder-listed above
  # (Logan/Lodgy are no longer sold new) - Spring (electric-only) and
  # Sandero Stepway are their own price lists, not folded into
  # Sandero/Duster's. One PDF per model (like Kia/VW, unlike Škoda's/
  # BMW's/Mercedes-Benz's combined documents) - DaciaParser extracts the
  # model name from each PDF's own cover page.
  - brand: dacia
    country: cz
    source_url: "https://www.dacia.cz/ceniky-a-brozury.html"
    pdf_pattern: null
    parser_key: dacia
    active: true
    models: [Spring, Sandero, Sandero Stepway, Jogger, Duster, Bigster]

  # Verified 2026-08-29. Unlike every other brand above, Mercedes-Benz
  # doesn't publish a PDF per model at all - the ceniky.html page below
  # links ONE combined "Souhrnný ceník" covering the entire current
  # lineup (74 pages, all body styles), so MercedesBenzDiscoverer doesn't
  # do per-model discovery like Volkswagen/Hyundai, it just finds that
  # one document (see monitors/discovery/mercedes_benz.py - the link
  # isn't in the rendered HTML as a plain <a href>, it's read out of an
  # inline JSON payload instead). MercedesBenzParser then picks the
  # models below out of the combined PDF by their own chapter heading and
  # ignores the rest (A-Class, GLA, GLC, S-Class, EQ*, AMG, ...) - see
  # that parser's module docstring. Sedan and estate ("kombi") are
  # separate chapters in the source and come out as "C-Class"/"C-Class
  # Estate" and "E-Class"/"E-Class Estate" respectively - the Estate
  # variants don't need their own entry here, same principle as Hyundai's
  # "Tucson Hybrid" note above.
  - brand: mercedes-benz
    country: cz
    source_url: "https://www.mercedes-benz.cz/passengercars/services/ceniky.html"
    pdf_pattern: null
    parser_key: mercedes-benz
    active: true
    models: [C-Class, E-Class]

  # Not one of the top-10-by-CZ-market-share brands above - added because
  # backend/app/db/seed.py's hand-verified demo vehicle is a Mazda CX-5,
  # and until this source existed that was the ONLY Mazda data in the
  # catalog (2 configurations). Verified 2026-08-29: a single listing page
  # (like Škoda), but client-rendered - the PDF links are read out of an
  # inline JSON payload the same way as Mercedes-Benz's, see
  # monitors/discovery/mazda.py. Mazda's price-list PDFs are themselves
  # unlike any other brand's here (a 25-38 page interactive-brochure
  # export, not a plain price table) - see parsers/mazda.py's module
  # docstring for the extraction technique this needed. "3" (hatchback,
  # the default nameplate) and "3 Sedan" both come from the "3" entry
  # below, same principle as Mercedes-Benz's sedan/estate split - a
  # separate models entry isn't needed for the Sedan variant.
  - brand: mazda
    country: cz
    source_url: "https://www.mazda.cz/formulae/cenik/"
    pdf_pattern: null
    parser_key: mazda
    active: true
    models: [CX-5, "3", CX-30]

  # Verified 2026-09-07 - the listing page itself has no PDF links (every
  # "Stáhnout" opens an AEM content-overlay fragment with the real links -
  # FordDiscoverer fetches each model's own overlay page directly rather
  # than this one, see that module's docstring), so pdf_pattern isn't used.
  # Ford's price lists are a genuine trim x engine MATRIX, structurally
  # unlike every other brand's parser here - only Puma/Kuga/Mustang/Bronco
  # (of Ford's ~10-model current CZ lineup) are covered so far; Explorer/
  # Puma Gen-E/Mustang Mach-E (electric - an extra "Dojezd"/range column
  # breaks this parser's column model), Tourneo Courier/Connect/Custom (a
  # different "AKČNÍ CENÍK" bez/s DPH layout), Puma ST (a "Benzín" header
  # this parser doesn't recognize) and Capri (unreachable from this
  # environment) are a known gap - see parsers/ford.py's module docstring.
  - brand: ford
    country: cz
    source_url: "https://www.ford.cz/pred-nakupem/dalsi-kroky/katalogy-a-ceniky-ke-stazeni"
    pdf_pattern: null
    parser_key: ford
    active: true
    models: [Puma, Kuga, Mustang, Bronco]

  # Verified 2026-09-12 - a single listing page (like Škoda/BMW/Dacia),
  # server-rendered, one plain "Ceník" link per model, no pdf_pattern
  # needed. Renault shares its parent Renault Group's own CDN with Dacia
  # (cdn.group.renault.com, /ren/ instead of /dac/), but the price-list
  # PDF template is different - a trim heading + one row per engine
  # underneath (closer to Kia's shape), see RenaultParser's own docstring.
  # Full current CZ personal-car lineup with a price list of its own: the
  # combustion/hybrid Clio/Captur/Symbioz/Arkana/Austral/Espace/Rafale,
  # plus five "e-tech elektrický" (electric-only) cars under revived
  # nameplates - Twingo, Renault 4 ("4"), Renault 5 ("5"), Megane, Scenic.
  # Kangoo/Trafic/Master (commercial vehicles, also on this same page,
  # each with their own combustion and electric price lists) are out of
  # scope, same "personal cars only" convention as every other brand here.
  - brand: renault
    country: cz
    source_url: "https://www.renault.cz/ceniky-a-brozury.html"
    pdf_pattern: null
    parser_key: renault
    active: true
    models: [Clio, Captur, Symbioz, Arkana, Austral, Espace, Rafale, Twingo, "4", "5", Megane, Scenic]

  # Verified 2026-08-29 - the page is reachable now (the "not fetch-
  # verified" note above predates this). Unlike Mercedes-Benz/Mazda's
  # combined documents, this one is a plain, simple price table (closer to
  # Škoda in spirit) - one section per model (heading like "BMW řady 3
  # Sedan (G20) / M3 Sedan (G80)" or "BMW X1 (U11)"), one row per
  # trim/engine. BmwParser reads every section generically rather than
  # matching a fixed list of names (see that parser's module docstring),
  # so `models` below is descriptive of what's covered, not something the
  # parser filters against - the source's parser_key applies to the WHOLE
  # document, all 29 sections in it (electric "iN"/"iX*" models and
  # plug-in hybrid rows mixed into their combustion model's section are
  # both classified automatically, not just the combustion lineup).
  - brand: bmw
    country: cz
    source_url: "https://www.bmw.cz/cs/topics/details/katalogy-ceniky-ke-stazeni.html"
    pdf_pattern: null
    parser_key: bmw
    active: true
    models: [1 Series, 2 Series Coupé, M2 Coupé, 2 Series Gran Coupé, 2 Series Active Tourer,
      3 Series Sedan, i3 Sedan, 3 Series Touring, 4 Series Coupé, 4 Series Cabrio,
      4 Series Gran Coupé, i4 Gran Coupé, 5 Series Sedan, i5 Sedan, 5 Series Touring,
      i5 Touring, 7 Series, i7, X1, iX1, X2, iX2, X3, iX3, X5, X6, X7, XM, iX]

  # Verified 2026-09-12 - a single listing page (like Škoda/BMW/Dacia),
  # server-rendered, one "Ceník" link per model. Unlike those three, the
  # link itself is a client-side download handler (href="#") - the real
  # path lives in a data-gtm-element-url attribute, and the MODEL is
  # identified by a sibling data-gtm-event attribute, not by anchor text
  # (every model's link just says "Ceník") - see CupraDiscoverer's own
  # docstring. pdf_pattern isn't used (matched by attribute, not a URL
  # regex). CUPRA's price lists read like Kia's (a trim heading, then one
  # row per engine underneath - not BMW's/Ford's column matrix); each
  # document can hold more than one such table (e.g. Leon's own "Tribe"
  # special edition gets a second full table later in the same PDF, all
  # read the same way - CupraParser doesn't special-case it).
  #
  # 6 of CUPRA's 8 current CZ nameplates have a price list of their own -
  # Ateca (sold stock-only) and Tavascan (CZ sales not yet started as of
  # this verification) don't, and are omitted rather than left as
  # placeholders with no discoverable link.
  - brand: cupra
    country: cz
    source_url: "https://www.cupraofficial.cz/nabidky/ceniky-a-katalogy"
    pdf_pattern: null
    parser_key: cupra
    active: true
    models: [Leon, Leon Sportstourer, Formentor, Terramar, Born, Raval]

  # Verified 2026-09-12/13 - unlike every other brand here, this listing
  # page (source_url) can't actually be fetched automatically at all:
  # opel.cz sits behind an Akamai WAF that blocks `requests` at the TLS/
  # network-fingerprint level (not just on missing headers - a full,
  # realistic browser header set still gets a 403 for the listing page
  # and even the bare homepage; verified separately that Windows' own
  # curl.exe gets blocked the same way even on the PDF endpoints
  # `requests` DOES get through on, ruling out a pure-shell workaround
  # too). OpelDiscoverer therefore hardcodes the 11 current document URLs
  # directly rather than finding them on this page - see its own
  # docstring for the staleness risk that comes with that (the URL path
  # embeds a quarter marker that will presumably roll over).
  #
  # `models` lists one entry per DOCUMENT rather than one per real-world
  # model name (OpelDiscoverer's own contract) - Astra alone needs 3
  # ("Astra HB"/"Astra ST"/"Astra Electric") to reach all of its own price
  # data, even though OpelParser then normalizes all 3 down to plain
  # "Astra" for the actual catalog. Opel's price table is a genuine column
  # grid (trim/LCDV code/engine/.../price), closer to Ford's own matrix
  # shape than Kia's/Renault's plain trim-heading list - see OpelParser's
  # module docstring for the column-position parsing that needs and the
  # boundary-classification pitfalls specific to this layout.
  #
  # 6 personal-car nameplates covered: Corsa, Astra (both body styles),
  # Mokka, Frontera, Grandland - each with its own combustion/hybrid
  # document plus its own separate all-electric one (Astra's two body
  # styles share one Electric document instead of splitting it too).
  # Combo/Vivaro/Movano commercial vehicles (also on this same listing
  # page, each with their own price lists) are out of scope, same
  # "personal cars only" convention as every other brand here.
  - brand: opel
    country: cz
    source_url: "https://www.opel.cz/nastroje/katalogy-a-ceniky.html"
    pdf_pattern: null
    parser_key: opel
    active: true
    models: [Corsa, Corsa Electric, Astra HB, Astra ST, Astra Electric, Mokka, Mokka Electric,
      Frontera, Frontera Electric, Grandland, Grandland Electric]

  # Verified 2026-09-13 - peugeot.cz's own listing page is blocked the
  # same Akamai way Opel's own is (see that entry's own comment), but
  # unlike Opel the actual PDFs live on a separate, unblocked site
  # (peugeot.ecpaper.cz - a flipbook viewer whose page embeds the real
  # Azure-hosted PDF). PeugeotDiscoverer hardcodes each model's own STABLE
  # ecpaper.cz viewer-page URL and resolves today's actual PDF link out of
  # that page live, so - unlike Opel's fully-hardcoded URLs - a routine
  # price refresh doesn't go stale here; only a genuine slug change (a new
  # model year) would need this source's own module updated by hand. See
  # PeugeotDiscoverer's own docstring.
  #
  # Peugeot is a fellow Stellantis brand alongside Opel and its price
  # table reads like a simplified version of Opel's own column grid, but
  # PeugeotParser reads it by line sequence rather than column position -
  # see its own module docstring for why, and for the two personal-car
  # nameplates NOT covered (plain "308" hatchback has no working price
  # list link; Traveller uses a different document structure entirely).
  #
  # 7 personal-car nameplates covered: 208, 2008, 308 SW, 3008, 408, 5008,
  # Rifter (whose own document covers two body lengths, "Rifter"/"Rifter
  # Long", plus two N1-light-commercial-homologation sections that are out
  # of scope - see PeugeotParser's own docstring). Expert/Partner/Boxer
  # commercial vehicles are out of scope, same "personal cars only"
  # convention as every other brand here.
  - brand: peugeot
    country: cz
    source_url: "https://www.peugeot.cz/uzitecne-odkazy/ceniky.html"
    pdf_pattern: null
    parser_key: peugeot
    active: true
    models: ["208", "2008", "308 SW", "3008", "408", "5008", Rifter]

  # Verified 2026-09-13 - unlike Opel/Peugeot, mgmotor-czech.cz has no
  # bot-blocking at all; the homepage itself links every current model's
  # own "Ceník" PDF directly (no separate listing page), same single-page
  # shape as Škoda/BMW/Dacia's own discoverers. MgDiscoverer maps each PDF
  # link's own filename to the model name MgParser's own cover-page
  # extraction would produce for it - see MgDiscoverer's own docstring.
  #
  # MG's price table reads like Kia's/Renault's own (trim heading, then
  # one row per engine), but with a wrinkle neither of those needed: a
  # trim heading covering more than one row is a single cell vertically
  # MERGED across the whole group (the same pattern OpelParser's own
  # `_nearest_trim` solves there) - see MgParser's own module docstring,
  # including for the two skipped stock-only/seasonal-promo tables and
  # the model-name/release-date extraction quirks specific to this brand.
  #
  # All 7 of MG's current CZ nameplates are covered - unlike every other
  # brand here, there's no separate commercial-vehicle lineup to exclude;
  # MG only sells passenger cars in this market.
  - brand: mg
    country: cz
    source_url: "https://www.mgmotor-czech.cz"
    pdf_pattern: null
    parser_key: mg
    active: true
    models: ["3", "S9 PHEV", ZS, HS, "4 EV Urban", "S5 EV", Cyberster]

  # Verified 2026-09-14 - unlike every other brand here, Audi doesn't
  # publish a downloadable price-list PDF at all (audi.cz's own homepage
  # and "Všechny modely" page have no "ceníky ke stažení" link anywhere).
  # The real breakdown only exists inside the web configurator
  # (konfigurator.audi.cz), a JS-rendered app - but its own network calls
  # reveal a plain JSON API behind it that returns every current model
  # group, engine and price in ONE response, reachable with a bare
  # `requests.get()` (no blocking). `content_type: json` routes this
  # source through `JsonDownloader` instead of `PdfDownloader`, and makes
  # `ScraperPipeline` skip the PDF-only release-date step for it (see
  # sources/registry.py's own `content_type` docstring) - Audi's own API
  # has no comparable "valid from" field to read anyway, so its documents
  # just keep the download date, same as most other brands here.
  #
  # AudiParser reads real trim data out of this response after all -
  # despite Audi's own CZ configurator having no named equipment tiers
  # the way Škoda's Style/Selection does, there IS a genuine base/"S line"
  # price split hiding in the data once several model groups are compared
  # - see AudiParser's own module docstring for the classification rules,
  # including why S3/RS3-style performance variants are promoted to their
  # own model instead (BMW's own M2/M4 convention, not a trim).
  #
  # Like BMW's own combined price list, one document covers Audi's entire
  # current lineup - `models` below is descriptive of what's covered
  # (all 22 of Audi's own current CZ model groups), not something the
  # parser filters against, same convention as BMW's own entry.
  - brand: audi
    country: cz
    source_url: "https://www.audi.cz"
    pdf_pattern: null
    parser_key: audi
    active: true
    content_type: json
    models: [A3 Limuzína, A3 Sportback, A3 allstreet, A5 Limuzína, A5 Avant, A6 Limuzína,
      A6 Sportback e-tron, A6 Avant, A6 Avant e-tron, A6 allroad, e-tron GT, Q3, Q3 Sportback,
      Q4 e-tron, Q4 Sportback e-tron, Q5, Q5 Sportback, Q6 e-tron, Q6 Sportback e-tron,
      Q7 SUV, Q8 SUV, Q9 SUV]

  # Verified 2026-09-14. Like Audi, Tesla has no downloadable price-list
  # PDF; unlike Audi, it also has no clean, separately-callable JSON API -
  # the real data lives embedded in each model's own web-configurator
  # ("Design Studio") page HTML (`content_type: html`, routing through the
  # new `HtmlDownloader` - see parsers/tesla.py's own module docstring for
  # the extraction technique). Only two models are currently sold in the
  # Czech Republic (Model S/X have no CZ configurator page at all), so
  # TeslaDiscoverer just returns both fixed `/design` URLs directly, same
  # "no real discovery needed" convention as Audi's/BMW's own entries.
  #
  # `active: false`, unlike every other brand registered here: every path
  # on tesla.com (not just a listing page, unlike Opel's/Peugeot's own
  # WAFs) returns a 403 from AkamaiGHost for a bare `requests.get()`, even
  # with the same full browser header set that clears those - and a real
  # Playwright browser (headless or headed, default fingerprint) hits an
  # Akamai Bot Manager JS sensor challenge instead of the real page, which
  # did not resolve to real content in this environment either. TeslaParser
  # itself IS fully implemented and verified - against real pages saved
  # through an interactive browser session that wasn't itself blocked (see
  # scraper/tests/fixtures/tesla_modely_design.html/tesla_model3_design.html
  # and test_tesla_parser.py) - so this source is ready to flip to
  # `active: true` once it can actually be fetched unattended (e.g. a
  # proper headed-Chromium + display setup, or running from a network
  # Akamai doesn't challenge this way), same "documented, not silently
  # worked around" spirit as this file's own Ford/BMW "not independently
  # verified from this environment" note above.
  - brand: tesla
    country: cz
    source_url: "https://www.tesla.com/cs_cz"
    pdf_pattern: null
    parser_key: tesla
    active: false
    content_type: html
    models: [Model Y, Model 3]
