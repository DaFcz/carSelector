# asyncio_mode=auto lets async test functions (backend/tests/ui/) run
# without an explicit @pytest.mark.asyncio on each one; harmless to the
# existing sync backend/tests/*.py (this only changes how `async def
# test_...` functions are collected). The nicegui.testing.user_plugin
# activates the `user` fixture (see backend/tests/ui/conftest.py) used to
# drive the UI without a real browser - see backend/README.md's Tests
# section.
[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p nicegui.testing.user_plugin"

# Ruff (lint + format) for all Python in the repo - backend/, scraper/,
# scripts/ share this one config, same as they share the root venv. Run
# from the repo root: `ruff check .` and `ruff format .`.
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["storage", "backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # `ruff format` wraps code; what's left is long strings/comments
    "UP042",  # str+Enum -> StrEnum changes str() output (DB/JSON values)
]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are used by naming them as parameters, which shadows
# the re-imported fixture function
"**/tests/**" = ["F811"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scraper", "tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection via default arguments is intended
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
